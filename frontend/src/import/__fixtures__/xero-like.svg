<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <title>Xero-like test ad (import fixture)</title>
  <defs>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ECCFF"/>
      <stop offset="1" stop-color="#1F65D6"/>
    </linearGradient>
  </defs>
  <rect id="Background" width="1080" height="1350" fill="#000856"/>
  <path id="Sky bloom" fill="#3ECCFF" d="M1080 640 C 940 600 820 700 780 840 C 740 980 600 1040 470 1110 C 360 1170 300 1260 290 1350 L 1080 1350 Z"/>
  <path id="Blue bloom" fill="#1F65D6" d="M0 1350 L0 1080 C 120 1040 220 1120 260 1350 Z"/>
  <circle cx="930" cy="190" r="70" fill="url(#dot)"/>
  <g id="Headline group" transform="translate(64 96) scale(1.25)">
    <text id="Headline" font-family="'National 2 Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="88" fill="#FFFFFF">
      <tspan x="0" y="80">Cash flow without</tspan>
      <tspan x="0" y="166">the suspense.</tspan>
    </text>
  </g>
  <text id="Sub" x="64" y="420" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="34" fill="#FFFFFF">Invoices, payments and payroll in one place.</text>
  <rect id="CTA box" x="64" y="480" width="300" height="84" rx="12" fill="#3ECCFF"/>
  <text id="CTA" x="214" y="533" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="32" fill="#000856">Try Xero free</text>
  <image id="Coin" x="640" y="760" width="320" height="320" xlink:href="data:image/png;base64,"/>
  <text id="Disclaimer" x="64" y="1290" font-family="Inter, Arial, sans-serif" font-size="24" fill="#FFFFFF" opacity="0.8">Terms apply.</text>
  <text id="Hidden note" x="64" y="700" display="none" font-family="Inter" font-size="40" fill="#FFFFFF">Hidden note</text>
</svg>
